# The original game: assemble its four sources on Windows and Linux (original/build.py, as
# BUILDING.md describes) and check them against the original disk's files (SHA-1), the main
# program packed too.
name: original

on:
  push:
    paths: ['original/*.s', 'original/*.i', 'original/build.*', 'original/tools/disk/pack.py', '.gitattributes', '.github/workflows/original.yml', '.github/actions/**']
  pull_request:
    paths: ['original/*.s', 'original/*.i', 'original/build.*', 'original/tools/disk/pack.py', '.gitattributes', '.github/workflows/original.yml', '.github/actions/**']
  workflow_dispatch:

env:
  PYTHONUTF8: '1'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, python: '3.13'}
          - {os: ubuntu-latest, python: '3.11'}            # the oldest Python tested
          - {os: ubuntu-latest, python: '3.13'}
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: ./.github/actions/vasm
      - name: Assemble and check (original/build.py)
        run: python original/build.py
      - name: The same with build.sh (Linux)
        if: runner.os != 'Windows'
        run: sh original/build.sh
      - name: The checkout is unchanged
        shell: bash
        run: |
          test -z "$(git status --porcelain)" || { git status --porcelain | sed 's/^/::error::changed by the build - /'; exit 1; }
