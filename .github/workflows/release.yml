# The enhanced disk, attached to a release as NewZealandStory_Enhanced_<tag>.adf.
#
# Two ways to run it:
# * Publish a release on GitHub (Releases -> Draft a new release): the disk is built from the
#   release's tag and attached to it.
# * Run it by hand (Actions -> release -> Run workflow) with a tag, for example V1.0: if that
#   release does not exist yet it is made here - the tag on the chosen branch (main) as it is now,
#   titled "The New Zealand Story - Enhanced <tag>", its notes from .github/release-notes/<tag>.md
#   (or GitHub's generated notes if there is no such file) - with the disk built from that commit.
#   If it exists, its disk is rebuilt from its tag and replaced.
name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: The release's tag (for example V1.0)
        required: true

permissions:
  contents: write                                     # to make the release and attach files to it

jobs:
  disk:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      PYTHONUTF8: '1'
    steps:
      - name: Does the release exist?
        id: rel
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"; echo "ref=$TAG" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"; echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "Release $TAG does not exist: it will be made from $GITHUB_REF_NAME ($GITHUB_SHA)"
          fi
      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.rel.outputs.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: ./.github/actions/vasm
      - name: Build the disk (enhanced/tools/build_disk.py)
        run: python enhanced/tools/build_disk.py
      - name: Make the release (run by hand, for a new tag)
        if: steps.rel.outputs.exists != 'true'
        run: |
          notes=".github/release-notes/${TAG}.md"
          if [ -f "$notes" ]; then set -- --notes-file "$notes"; else set -- --generate-notes; fi
          gh release create "$TAG" --target "$GITHUB_SHA" --title "The New Zealand Story - Enhanced ${TAG}" "$@"
      - name: Attach the disk to the release
        run: |
          cp enhanced/build/nzs.adf "NewZealandStory_Enhanced_${TAG}.adf"
          sha1sum "NewZealandStory_Enhanced_${TAG}.adf"
          gh release upload "$TAG" "NewZealandStory_Enhanced_${TAG}.adf" --clobber
